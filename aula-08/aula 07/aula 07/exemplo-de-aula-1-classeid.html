<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplos de classe e id</title>

    <style>
        .caixa{
            border: 3px solid red;
            background-color: white;
            color: red;
            padding: 5px;
            margin-right: 1600px;
            
        }

        #aviso {
            width: 200px;
            height: 100px;
        }
    </style>





</head>
    <body>
        <h1>exemplo de classe e id</h1>

        <p>
        paragrafo comum da pagina
     </p>
        <div>esta e uma div sem formatação.</div>
        <br>
        <div class = "caixa" id = (aviso)>
            
            esta div utiliza a classe e o indetificador aviso
        </div>

        <br>

        <span> esse e span um sem formatação </span>

        <br>
        <br>

         
        <span class = "caixa">  esse e um span utilizando classe baixa
         </span>
</body>
</html>
