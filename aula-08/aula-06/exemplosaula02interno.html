<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplode classe e CSS interno </title>
    <style>
            .titulo{
                color:lightskyblue;
                text-align: center;

            }

            .caixa01{
                background-color: rgb(255, 0, 0);
                border: 2px solid cornflowerblue;
                padding: 20px;
                margin: 20px;
            }
            .caixa02{
                background-color: rgb(255, 13, 13);
                border: 2px solid rgb(48, 4, 4);
                padding: 20px;
                margin: 20px;
            }

            .destaque1{
                color: beige;
                font-weight: bold;
            }

            .destaque2{
                color: rgb(255, 8, 8);
                background-color: rgb(255, 0, 221);
                font-style: italic;
                padding: 10px;
            }






    </style>


</head>
<body>
    <h1 class="titulo">Aprendendo classes em css</h1>
    <div class="caixa01">
        <p>
        Estou apredendo a ultilizar classes para personalizar
        os elementos de uma pagina.

        </p>
        <br>
        <p class="destaque1">

        </p>
        <p class="destaque2">
            este paragrafo utiliza a classe destaque02
        </p>
        </div>
        <div class="caixa02">
            <p>
            este paragrafo nao utiliza nenhuma classe  </p> 
        </div>
</body>
</html>
