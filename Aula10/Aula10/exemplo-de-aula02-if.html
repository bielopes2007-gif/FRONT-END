
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horário e previsão do tempo</title>
</head>
<body>

    <h1>Horário e previsão do tempo</h1>

    <p>
        O programa mostrará uma saudação e uma
        recomendação de acordo com o clima.
    </p>

    <script>
        const dataHora = new Date();
        const hora = dataHora.getHours();

        let previsaoTempo = prompt(
            "Como está o tempo? Digite chuvoso ou ensolarado:"
        );

        previsaoTempo = previsaoTempo.toLowerCase().trim();

        // Saudação de acordo com o horário
        if (hora < 12) {
            alert("Bom dia com Jesus");
        }
        else if (hora < 18) {
            alert("Boa tarde");
        }
        else {
            alert("Boa noite");
        }

        // Recomendação de acordo com o clima
        if (previsaoTempo === "ensolarado") {
            alert("Use protetor solar!");
        }
        else if (previsaoTempo === "chuvoso") {
            alert("Não esqueça o guarda-chuva!");
        }
        else {
            alert("Não reconheci essa previsão do tempo.");
        }

    </script>

</body>
</html>
